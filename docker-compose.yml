networks:
  nanolayer-network:
    driver: bridge
    name: nanolayer-network

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: nanolayer-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/key:/app/key:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    networks:
      - nanolayer-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nanolayer-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - nanolayer-network
    # 前端为构建期打包 import.meta.env；运行时此处变量不会写入 JS。
    # 生产环境应使用同源 /api（由 nginx 代理后端），勿把 API 指到 localhost。

