# STEP1 — 仅用于首次签发证书（或排查 ACME）。拷贝为 /etc/nginx/conf.d/nanolayer.conf
#
# 必须优先于「整站反代到 8080」的配置，且本 server 内要先写 /.well-known 再写 location /
#
# sudo mkdir -p /var/www/certbot/.well-known/acme-challenge
# sudo nginx -t && sudo systemctl reload nginx
# 自测（应在响应体看到 ok）：
#   echo ok | sudo tee /var/www/certbot/.well-known/acme-challenge/ping.txt
#   curl -sS http://127.0.0.1/.well-known/acme-challenge/ping.txt -H 'Host: nanolayer.xinye-atom.work'
#   curl -sS http://nanolayer.xinye-atom.work/.well-known/acme-challenge/ping.txt
#
# sudo certbot certonly --webroot -w /var/www/certbot -d nanolayer.xinye-atom.work --agree-tos -m you@example.com
#
# 证书签发成功后：删掉本文件在 conf.d 中的副本，改用 nanolayer.xinye-atom.work.ssl.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nanolayer.xinye-atom.work;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        client_max_body_size 50M;
    }
}
