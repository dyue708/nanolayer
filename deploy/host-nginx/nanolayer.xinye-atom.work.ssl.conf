# 证书签发后使用：HTTP 只做 ACME + 跳转 HTTPS，443 反代 Docker 前端 8080
#
# sudo cp deploy/host-nginx/nanolayer.xinye-atom.work.ssl.conf /etc/nginx/conf.d/nanolayer.conf
# sudo nginx -t && sudo systemctl reload nginx
#
# 以下 TLS 为内联配置，不依赖 /etc/letsencrypt/options-ssl-nginx.conf（部分环境安装 certbot 后也不会生成该文件）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nanolayer.xinye-atom.work;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nanolayer.xinye-atom.work;

    ssl_certificate     /etc/letsencrypt/live/nanolayer.xinye-atom.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanolayer.xinye-atom.work/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
