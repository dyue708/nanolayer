# （汇总说明）宿主机 Nginx + Let’s Encrypt — nanolayer.xinye-atom.work
#
# 不要用本文件直接覆盖 conf.d（曾经包含「尚未签发证书就无法 nginx -t」的 443 段）。
# 请按顺序使用这两个文件：
#
# 1) 首次申请证书：
#    sudo cp deploy/host-nginx/nanolayer.xinye-atom.work.step1-http.conf /etc/nginx/conf.d/nanolayer.conf
#    sudo rm -f /etc/nginx/conf.d/nanolayer.xinye-atom.work.conf   # 若之前拷过带 ssl 的同名文件，删掉避免重复 server
#    sudo nginx -t && sudo systemctl reload nginx
#
# 2) 验证 webroot（必须通过，否则 certbot 会 404）：
#    sudo mkdir -p /var/www/certbot/.well-known/acme-challenge
#    echo ok | sudo tee /var/www/certbot/.well-known/acme-challenge/ping.txt
#    curl -sS http://nanolayer.xinye-atom.work/.well-known/acme-challenge/ping.txt
#
# 3) 签发：
#    sudo certbot certonly --webroot -w /var/www/certbot -d nanolayer.xinye-atom.work --agree-tos -m you@example.com
#
# 4) 上线 HTTPS：
#    sudo cp deploy/host-nginx/nanolayer.xinye-atom.work.ssl.conf /etc/nginx/conf.d/nanolayer.conf
#    sudo apt install -y python3-certbot-nginx   # 提供 options-ssl-nginx.conf（若仍未生成 ssl-dhparams，见 ssl 文件内注释）
#    sudo nginx -t && sudo systemctl reload nginx
#
# 若 curl 公网仍为 404、但本机 curl -H Host 正常：检查是否另有 default_server 占用 80，或 CDN/WAF 缓存了旧响应。
#
# 详见：nanolayer.xinye-atom.work.step1-http.conf、nanolayer.xinye-atom.work.ssl.conf
