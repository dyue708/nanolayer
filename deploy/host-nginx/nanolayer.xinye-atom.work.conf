# Nanolayer — 宿主机 Nginx（HTTPS 终止）→ 本机 Docker 前端 8080（容器内已代理 /api 到后端）
#
# ========== 阿里云 ==========
# 1) 解析：在阿里云 DNS 为 nanolayer.xinye-atom.work 添加 A 记录指向该 ECS 公网 IP
# 2) 安全组：放行 TCP 80、443（以及你 SSH 端口）；8080 建议仅内网访问，可不对外开放
#
# ========== 首次申请证书（HTTP-01，不走停服务）==========
# sudo mkdir -p /var/www/certbot/.well-known/acme-challenge
# 第一次先把「仅 HTTP、带 webroot、且不把 / 重定向到 HTTPS」的配置启用（见文件末尾 STEP1 示例），然后：
# sudo certbot certonly --webroot -w /var/www/certbot -d nanolayer.xinye-atom.work --agree-tos -m your@email.com
# 证书就绪后，改用下面两个 server（含 443），nginx -t && systemctl reload nginx
#
# ========== 安装与启用 ==========
# sudo cp deploy/host-nginx/nanolayer.xinye-atom.work.conf /etc/nginx/conf.d/nanolayer.conf
# sudo nginx -t && sudo systemctl reload nginx
#
# ========== 自动续期 ==========
# certbot 安装后通常自带 systemd timer；检验：sudo systemctl status certbot.timer
# 若无 timer，可用 cron（每日静默续期，成功后 reload nginx）：
#   sudo crontab -e
#   0 3 * * * certbot renew --quiet --deploy-hook "systemctl reload nginx"

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# —— 证书签发后使用：HTTP 仅 ACME + 跳转 HTTPS ——
server {
    listen 80;
    listen [::]:80;
    server_name nanolayer.xinye-atom.work;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nanolayer.xinye-atom.work;

    ssl_certificate     /etc/letsencrypt/live/nanolayer.xinye-atom.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanolayer.xinye-atom.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

